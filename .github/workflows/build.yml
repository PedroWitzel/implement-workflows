name: TestWorkflow3
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake
        run: cmake -B build
      - name: Build
        run: cmake --build build
      - uses: actions/upload-artifact@v4
        with: 
          name: binaries
          path: build/cpu_monitor_app
  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: 
          name: binaries
          path: binaries/
      - run: make test