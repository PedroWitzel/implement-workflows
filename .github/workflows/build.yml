name: TestWorkflow8
on: [push, pull_request]

jobs:
  build:
    runs-on: [
        self-hosted, 
        linux,
        x64
        ]
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build

      - name: Build
        run: cmake --build build
        
      - uses: actions/upload-artifact@v4
        with: 
          name: binaries
          path: build/cpu_monitor_app
          
  test:
    needs: build
    runs-on: [
        self-hosted, 
        linux,
        x64
        ]
    steps:
      - uses: actions/checkout@v4

      - name: Configure and Compile
        run: |
          cmake -B build
          cmake --build build

      - name: Run Tests
        run: ctest --test-dir build --output-on-failure
